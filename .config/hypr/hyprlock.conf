$font = Rodondo
$calendar_color = rgba(ffffffcc)
$clock_color = rgba(ffffffcc)
$battery_color = rgba(ffffffcc)
$input_color = rgba(ffffff22)

general {
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fade, 0
    animation = fadeIn, 1, 2, linear
    animation = inputFieldColors, 1, 6, linear
    animation = inputFieldFade, 1, 3, linear
    animation = inputFieldWidth, 1, 2, linear
    animation = inputFieldDots, 1, 3, linear
}

background {
    monitor =
    reload_cmd = echo $HOME/.config/wallpapers/current.png
    reload_time = 0
}

input-field {
    monitor =
    size = 17%, 5%
    outline_thickness = 3

    dots_size = 0.3
    dots_spacing = 0.5

    rounding = -1
    fade_on_empty = true
    placeholder_text =

    outer_color = $input_color
    inner_color = rgba(00000000)
    font_color = $input_color
    check_color = rgba(ffffffaa)

    position = 0, 7%
    halign = center
    valign = bottom
}

# Hours
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "$(date +"%H")"
    color = $clock_color
    font_size = 80
    font_family = $font

    position = -35%, 7%
    halign = center
    valign = center
}

# Minutes
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "$(date +"%M")"
    color = $clock_color
    font_size = 80
    font_family = $font

    position = -35%, -1%
    halign = center
    valign = center
}

# Weekday
label {
    monitor = eDP-1
    text = cmd[update:18000000] echo "$(date +'%a')"
    color = $calendar_color
    font_size = 70
    font_family = $font

    position = 35%, 7%
    halign = center
    valign = center
}

# Date
label {
    monitor = eDP-1
    text = cmd[update:18000000] echo "<b> "$(date +'%d %b')" </b>"
    color = $calendar_color
    font_size = 45
    font_family = $font

    position = 35%, 1%
    halign = center
    valign = center
}

# Battery
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "$($HOME/.config/scripts/battery.sh)"
    color = $battery_color
    font_size = 50
    font_family = $font
    position = 35%, -6%
    rotate = -90
    halign = center
    valign = center
}

# Shutdown
image {
    onclick = systemctl poweroff
    monitor = eDP-1
    path = ~/.config/hypr/icons/shutdown.png

    size = 60
    rounding = 0
    border_size = 0

    position = -6%, -3%
    halign = center
    valign = top
}

# Reboot
image {
    onclick = systemctl reboot
    monitor = eDP-1
    path = ~/.config/hypr/icons/reboot.png

    size = 60
    rounding = 0
    border_size = 0

    position = -2%, -3%
    halign = center
    valign = top
}

# Suspend
image {
    onclick = systemctl suspend
    monitor = eDP-1
    path = ~/.config/hypr/icons/suspend.png

    size = 60
    rounding = 0
    border_size = 0

    position = 2%, -3%
    halign = center
    valign = top
}

# Log out
image {
    onclick = hyprctl dispatch 'hl.dsp.exit()'
    monitor = eDP-1
    path = ~/.config/hypr/icons/log_out.png

    size = 60
    rounding = 0
    border_size = 0

    position = 6%, -3%
    halign = center
    valign = top
}
